      run_help: "La génération tourne en arrière-plan, par petits paquets d'appels API."
      history: "Historique"
      history_help: "Chaque génération peut être rouverte, et tout ce qu'elle a créé supprimé en un clic."
      daily: "Faire vivre le forum tout seul"
      daily_help: "Génère chaque jour un petit lot, daté du jour, en réutilisant les membres créés précédemment. Il reprend le brief de votre dernière génération manuelle : lancez-en une d'abord."
      retag: "Étiqueter les discussions existantes"
      retag_help: "Classe les fils déjà présents sur le forum dans la liste d'étiquettes ci-dessus. Rien n'est écrit, modifié ni supprimé : seules des étiquettes sont ajoutées."

