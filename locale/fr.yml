pbiaut-ai-seeder:
  admin:
    sections:
      connection: "Connexion OpenAI"
      connection_help: "La clé reste sur le serveur et n'est transmise qu'aux administrateurs."
      context: "De quoi parle ce forum"
      context_help: "Tout ce qui est saisi ici part dans les prompts. Plus c'est précis, moins le contenu généré est générique."
      sample: "Essayer sur un seul fil"
      sample_help: "Génère un fil complet et l'affiche ici. Rien n'est écrit sur le forum."
      volumes: "Volumes et période"
      volumes_help: "Combien créer, sur quelle période, et selon quel rythme d'activité."
      preview: "Plan jour par jour"
      preview_help: "Calculé localement. Rien n'a été envoyé à OpenAI et rien n'a encore été créé."
